{% macro password_field(id, label, autocomplete, minimum=0) %}
<div>
  <label class="form-label" for="{{ id }}">{{ label }}</label>
  <div class="password-field">
    <input class="form-control" id="{{ id }}" name="{{ id }}" type="password"
           autocomplete="{{ autocomplete }}"{% if minimum %} maxlength="128" minlength="{{ minimum }}"{% endif %} required>
    <button class="password-toggle" type="button" data-password-toggle aria-controls="{{ id }}"
            aria-label="Hiện {{ label | lower }}" aria-pressed="false"
            data-show-label="Hiện {{ label | lower }}" data-hide-label="Ẩn {{ label | lower }}" hidden>
      <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.5"/>
      </svg>
      <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true">
        <path d="m3 3 18 18M10 6.2a11 11 0 0 1 2-.2c6.5 0 10 6 10 6a15 15 0 0 1-3 3.4M17 17a10 10 0 0 1-5 1c-6.5 0-10-6-10-6a15 15 0 0 1 4-4.1"/>
      </svg>
    </button>
  </div>
</div>
{% endmacro %}
