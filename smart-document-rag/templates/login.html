{% extends "base.html" %}
{% from "password_field.html" import password_field %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<section class="panel auth-card">
  <p class="brand auth-brand"><span class="brand-mark" aria-hidden="true">✦</span>SmartDoc</p>
  <h1>Đăng nhập</h1>
  <form method="post" class="vstack gap-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div><label class="form-label" for="username">Tên đăng nhập</label><input class="form-control" id="username" name="username" autocomplete="username" maxlength="80" required autofocus></div>
    {{ password_field("password", "Mật khẩu", "current-password") }}
    <button class="btn btn-primary" type="submit">Đăng nhập</button>
  </form>
  <p class="mb-0 mt-3">Chưa có tài khoản? <a href="{{ url_for('register') }}">Đăng ký ngay</a></p>
</section>
{% endblock %}
